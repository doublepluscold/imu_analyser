; Slave: ESP-01 (ESP8266). Reads MTData2 from the IMU module UART, sends each valid frame by ESP-NOW.
;
;   pio run                      build (DEBUG_LOG 0, production: nothing printed on UART)
;   pio run -e esp01_debug       build with stats on TX (bench only, see README)
;   pio run -t upload

[platformio]
default_envs = esp01

[env]
platform = espressif8266
framework = arduino
board = esp01_1m
lib_deps = symlink://../common
monitor_speed = 115200
upload_speed = 115200

[env:esp01]
build_flags = -DDEBUG_LOG=0

; Bench only: TX of ESP-01 prints stats. TX must NOT be wired to the IMU module RX.
[env:esp01_debug]
build_flags = -DDEBUG_LOG=1

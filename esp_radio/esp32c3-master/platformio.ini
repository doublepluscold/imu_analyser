; Master: ESP32-C3 Mini. Receives ESP-NOW from slaves, sends datagrams and "# " text lines over USB-CDC.
; The laptop connects to THIS board's USB port. Replaces esp32s3/ as master (kept, unchanged).
;
;   pio run                 build
;   pio run -t upload       flash

[platformio]
default_envs = esp32c3

[env:esp32c3]
; Arduino core 3.x, same pioarduino fork as ../esp32s3 and ../esp32c3-slave.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
lib_deps = symlink://../common
; Serial = native USB-CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600

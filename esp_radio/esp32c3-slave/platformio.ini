; Slave: ESP32-C3 Mini. Reads MTData2 from the IMU module UART (RX only), sends each valid frame by ESP-NOW.
; Replaces esp-01/ (kept for reference). Master and packet format are unchanged.
;
;   pio run -e esp32c3           build (DEBUG_LOG 0)
;   pio run -e esp32c3_debug     build with stats on USB-CDC (Serial), safe: not the module UART
;   pio run -e esp32c3_beacon    RADIO SELF-TEST: synthetic frames, UART ignored (see BRINGUP.md)
;   pio run -e esp32c3 -t upload

[platformio]
default_envs = esp32c3

[env]
; Same pioarduino fork as ../esp32s3 (Arduino core 3.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
lib_deps = symlink://../common
; Serial = native USB-CDC, a separate port from Serial1 (module UART).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600

[env:esp32c3]
build_flags = ${env.build_flags} -DDEBUG_LOG=0

[env:esp32c3_debug]
build_flags = ${env.build_flags} -DDEBUG_LOG=1

; Radio self-test: sends a synthetic MTData2 frame 20x/s, no IMU or UART wiring needed.
; DEBUG_LOG=1 prints to USB-CDC (Serial), not the module UART, so it is safe; sent= should grow ~20/s.
[env:esp32c3_beacon]
build_flags = ${env.build_flags} -DDEBUG_LOG=1 -DTEST_BEACON=1

; Master: ESP32-S3 + W5500 (SPI Ethernet). Receives ESP-NOW from slaves, sends UDP to the laptop.
;
;   pio run -e esp32s3           build
;   pio run -e esp32s3 -t upload flash
;   pio test -e native           unit tests on PC

[platformio]
default_envs = esp32s3

[env:esp32s3]
; Arduino core 3.x (ETH.h with W5500, esp_now_recv_info_t), same fork as ../esp32c3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
lib_deps = symlink://../common
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600

[env:native]
platform = native
lib_deps = symlink://../common
test_framework = unity
build_flags = -std=gnu++17
